name: Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Without stellar-core on PATH the battlefield suite silently drops the
      # captive-core fetcher and asserts against the poller alone — the backend
      # the suite exists to regression-check, not the supported one. SDF ships
      # amd64 only, which is what ubuntu-latest runners are.
      - name: Install stellar-core
        run: |-
          set -eux
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -sSL https://apt.stellar.org/SDF.asc | sudo gpg --dearmor -o /etc/apt/keyrings/SDF.gpg
          sudo chmod a+r /etc/apt/keyrings/SDF.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/SDF.gpg] https://apt.stellar.org ${VERSION_CODENAME} stable" \
            | sudo tee /etc/apt/sources.list.d/SDF.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends stellar-core
          stellar-core version

      - name: Build & Run Stellar Tests
        working-directory: .
        run: |-
          go build ./...
          go test ./...

      # quickstart boots on its image's default protocol, which can lag the
      # network by more than one release. Run the battlefield again on the
      # newest protocol both the bundled and the host stellar-core support, so
      # the next protocol's ledgers go through both fetchers before its vote.
      - name: Battlefield on the newest supported protocol
        run: |-
          set -eu
          max_protocol() { awk '/^ledger protocol version:/ {print $4}'; }
          image=$(docker run --rm --platform linux/amd64 --entrypoint /usr/bin/stellar-core stellar/quickstart:testing version | max_protocol)
          host=$(stellar-core version | max_protocol)
          protocol=$(( image < host ? image : host ))
          echo "image core supports ${image}, host core ${host}; upgrading quickstart to ${protocol}"
          QUICKSTART_PROTOCOL_VERSION=${protocol} go test -count=1 ./test/scenarios/...

      # The battlefield suite writes stellar-core's own output to file so the
      # test log stays readable, which leaves a CI failure with no way to see
      # why a fetcher produced nothing.
      - name: Upload battlefield logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: battlefield-logs
          path: |
            test/.data/fetchers.log
            test/.data/compose.log
          retention-days: 7
          if-no-files-found: warn
