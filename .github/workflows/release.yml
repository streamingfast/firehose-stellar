---
name: Build and push

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
      - "develop"
      - "feature/*"
  workflow_dispatch:

# Jobs that need more than reading the repository ask for it themselves.
permissions:
  contents: read

# A tag run is never cancelled, it is the one that pushes the release images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BINARY_NAME: firestellar

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is-release: ${{ steps.version.outputs.IS_RELEASE }}
      is-prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
      binary-matrix: ${{ steps.matrix.outputs.MATRIX }}

    steps:
      # A literal `edge` off a tag, not `edge-<sha>`: the per-architecture image
      # tags below embed this string, and deployments reference them.
      - name: Extract version
        id: version
        run: |
          version="edge"
          is_release="false"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              is_release="true"
            fi
          fi

          is_prerelease="false"
          if [[ "${version}" == *alpha* || "${version}" == *beta* || "${version}" == *rc* ]]; then
            is_prerelease="true"
          fi

          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"
          echo "IS_RELEASE=${is_release}" >> "$GITHUB_OUTPUT"
          echo "IS_PRERELEASE=${is_prerelease}" >> "$GITHUB_OUTPUT"

      # Cross compiling every platform on each branch push is mostly wasted time,
      # so only a release builds the full set. Everything else builds linux/amd64,
      # enough to catch a broken build. A manual run also builds everything, which
      # is how the full matrix gets validated before a tag is pushed.
      - name: Compute binary matrix
        id: matrix
        env:
          FULL_BUILD: ${{ steps.version.outputs.IS_RELEASE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          matrix=$(cat <<'JSON'
          {"include": [
            {"goos": "linux",  "goarch": "amd64", "runner": "ubuntu-24.04",     "smoke": true},
            {"goos": "linux",  "goarch": "arm64", "runner": "ubuntu-24.04-arm", "smoke": true},
            {"goos": "darwin", "goarch": "amd64", "runner": "ubuntu-24.04",     "smoke": false},
            {"goos": "darwin", "goarch": "arm64", "runner": "ubuntu-24.04",     "smoke": false}
          ]}
          JSON
          )

          if [[ "${FULL_BUILD}" != "true" ]]; then
            matrix=$(jq '{include: [.include[] | select(.goos == "linux" and .goarch == "amd64")]}' <<< "${matrix}")
          fi

          echo "MATRIX=$(jq --compact-output . <<< "${matrix}")" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    needs: [setup]

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.binary-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # streamingfast/actions/go-version would do this, but that repo is private and
      # this one is public, so the action cannot be resolved from here. The `toolchain`
      # directive wins over `go` when both are present, matching what the action does.
      - name: Resolve Go version
        id: go
        run: |
          set -euo pipefail

          version=$(sed -n 's/^toolchain go//p' go.mod)
          if [[ -z "${version}" ]]; then
            version=$(sed -n 's/^go //p' go.mod)
          fi
          if [[ -z "${version}" ]]; then
            echo "no go or toolchain directive found in go.mod" >&2
            exit 1
          fi

          echo "MAJOR_MINOR=$(cut -d. -f1,2 <<< "${version}")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The `binary` target stops short of the runtime stage, so extracting a
      # binary never runs the stellar-core install and never needs emulation,
      # whatever GOOS/GOARCH is asked for.
      - name: Build binary
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: binary
          outputs: type=local,dest=dist
          build-args: |
            GO_VERSION=${{ steps.go.outputs.MAJOR_MINOR }}
            GOOS=${{ matrix.goos }}
            GOARCH=${{ matrix.goarch }}
            VERSION=${{ needs.setup.outputs.version }}
          cache-from: type=gha,scope=binary-${{ matrix.goos }}-${{ matrix.goarch }}
          cache-to: type=gha,mode=max,scope=binary-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Inspect binary
        run: |
          chmod +x "dist/${BINARY_NAME}"
          file "dist/${BINARY_NAME}"

      # Each linux job runs on a runner of its own architecture, so the binary it
      # just produced can actually be executed here.
      - name: Smoke test binary
        if: matrix.smoke
        run: ./dist/"${BINARY_NAME}" --version

  docker:
    name: Docker ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Serial with the binaries on purpose: pushing an image, and moving `latest`
    # with it, for a tag whose binaries failed to build would leave a release
    # half published.
    needs: [setup, binaries]

    permissions:
      contents: read
      packages: write

    strategy:
      # One runner per architecture, never a single multi-platform build. The
      # runtime stage runs a shell to install stellar-core, so an arm64 image
      # built on an amd64 host would go through QEMU; the arm64 branch of that
      # RUN is a no-op but still has to execute. Native runners keep emulation
      # out of the picture entirely.
      matrix:
        include:
          - platform: linux/amd64
            platform_suffix: amd64
            runner: ubuntu-24.04

          - platform: linux/arm64
            platform_suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # streamingfast/actions/go-version would do this, but that repo is private and
      # this one is public, so the action cannot be resolved from here. The `toolchain`
      # directive wins over `go` when both are present, matching what the action does.
      - name: Resolve Go version
        id: go
        run: |
          set -euo pipefail

          version=$(sed -n 's/^toolchain go//p' go.mod)
          if [[ -z "${version}" ]]; then
            version=$(sed -n 's/^go //p' go.mod)
          fi
          if [[ -z "${version}" ]]; then
            echo "no go or toolchain directive found in go.mod" >&2
            exit 1
          fi

          echo "MAJOR_MINOR=$(cut -d. -f1,2 <<< "${version}")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Generate docker tags/labels from github build context
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Having version in suffix (either edge or <tag>) prevents collision for tag images which have a different version
          tags: |
            type=sha,prefix=,suffix=-${{ needs.setup.outputs.version }}-${{ matrix.platform_suffix }}
          flavor: |
            suffix=-${{ matrix.platform_suffix }}

      # provenance is off because the manifest join below expects each
      # per-architecture tag to be a plain image manifest, not an index carrying
      # attestations. This is also why streamingfast/actions/docker-build is not
      # used here: it has no input for it.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            GO_VERSION=${{ steps.go.outputs.MAJOR_MINOR }}
            VERSION=${{ needs.setup.outputs.version }}
          # Deliberately uncached. The stellar-core install sits above any COPY, so its
          # layer key is just the base digest and the ARG values — a cache hit would
          # skip apt AND the STELLAR_CORE_MIN_VERSION assertion, pinning the image to
          # whatever core was current when the layer was first built. Since the floor
          # is a floor and not a pin, a later SDF security release would never be
          # picked up and nothing would say so.

  docker-manifest:
    name: Docker manifest
    runs-on: ubuntu-24.04
    needs: [setup, docker]

    permissions:
      contents: read
      packages: write

    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Generate docker tags/labels from github build context
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,enable=${{ github.ref == 'refs/heads/main' }},value=main
            type=raw,enable=${{ github.ref == 'refs/heads/develop' }},value=develop
            type=raw,enable=${{ startsWith(github.ref, 'refs/heads/feature/') }},value={{branch}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') && needs.setup.outputs.is-prerelease == 'false' }}
          sep-tags: ","

      - name: Extract image
        id: image
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          echo "ID=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::7}-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest images
        uses: Noelware/docker-manifest-action@v1
        with:
          inputs: "${{ steps.image.outputs.ID }}-amd64, ${{ steps.image.outputs.ID }}-arm64"
          tags: "${{ steps.meta.outputs.tags }}"
          push: true

  slack-notifications:
    name: Slack notification
    runs-on: ubuntu-24.04
    needs: [docker-manifest]

    steps:
      - name: Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: Ilshidur/action-slack@2.0.2
        with:
          args: |
            :done: *${{ github.repository }}* Success building docker images from ${{ github.ref_type }} _${{ github.ref_name }}_ (${{ github.actor }}) :sparkling_heart: ```${{ needs.docker-manifest.outputs.tags }}```
